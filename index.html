<title>Jovem Aprendiz – Operação Resgate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: palco 16:9 centralizado, canvas lógico 480x270 escalado; controles touch sobrepostos nos cantos inferiores */
:root{
  --bg:#080b14; --ink:#f4efe6; --orange:#f08a1c; --purple:#7b3fc4; --blue:#2a6be0; --panel:#141a2b;
  --font:'Press Start 2P','Courier New',monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font);
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:none;user-select:none;-webkit-user-select:none;
}
html:fullscreen body,body:fullscreen{padding-left:0;padding-right:0}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block;outline:none}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
body.touch.playing #touch{display:block}
.pad{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;pointer-events:auto;touch-action:none}
#acts .col{display:flex;flex-direction:column;gap:10px;align-items:flex-end}#acts .row{display:flex;gap:10px}
#acts .crouch{--s:clamp(48px,12vmin,76px);width:calc(var(--s)*1.5);border-radius:calc(var(--s)*.5)}
#acts .btn svg{pointer-events:none}
#dpad{left:max(16px,env(safe-area-inset-left,0px))}
#acts{right:max(16px,env(safe-area-inset-right,0px));align-items:flex-end}
.btn{
  --s:clamp(52px,13vmin,88px);
  width:var(--s);height:var(--s);border-radius:50%;border:3px solid rgba(244,239,230,.55);
  background:rgba(20,26,43,.55);color:var(--ink);font:inherit;font-size:calc(var(--s)*.22);
  display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;
  backdrop-filter:blur(2px);
}
.btn.on{background:rgba(240,138,28,.75);border-color:#ffd9a8}
.btn.big{--s:clamp(64px,17vmin,108px);border-color:rgba(240,138,28,.9)}
.btn.sm{--s:clamp(44px,11vmin,70px)}
#pausebtn{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:auto;--s:clamp(40px,9vmin,56px);border-radius:10px;font-size:calc(var(--s)*.34)}
#rotate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:20;font-size:12px;line-height:2;color:var(--orange)}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
#toastpad{position:fixed;left:0;right:0;top:0}
</style>

    </div>

</div>

<script>
'use strict';
/* =====================================================================
   JOVEM APRENDIZ – OPERAÇÃO RESGATE  ·  Etapa 1 (base jogável + Fase 1)
   Módulos: Util · Save · Snd · Input · Scale · Sprites · BG · Levels ·
            Physics · Game · Screens · Loop
   ===================================================================== */
let W=480;const H=270,T=16,WMIN=480,WMAX=640;
const FONT="'Press Start 2P','Courier New',monospace";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------------- Util ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;fn(g,w,h);return c}
function txt(s,x,y,size,col,al,sh){
  ctx.font=(size||8)+'px '+FONT;ctx.textAlign=al||'left';ctx.textBaseline='top';
  if(sh!==false){ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillText(s,x+1,y+1)}
  ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);
}
const pad6=n=>String(Math.max(0,n|0)).padStart(6,'0');

/* ---------------- Save (localStorage com fallback em memória) ---------------- */
const Save={mem:{best:{},char:0,unlocked:1},ok:true,
  load(){try{const r=localStorage.getItem('jaor.save');if(r)this.mem=Object.assign(this.mem,JSON.parse(r))}catch(e){this.ok=false}},
  write(){try{localStorage.setItem('jaor.save',JSON.stringify(this.mem))}catch(e){this.ok=false}}
};

/* ---------------- Áudio (WebAudio sintetizado) ---------------- */
const Snd={ac:null,on:true,
  unlock(){
    if(!this.ac){try{this.ac=new(window.AudioContext||window.webkitAudioContext)();
      this.out=this.ac.createGain();this.out.gain.value=1;this.out.connect(this.ac.destination);
      this.mg=this.ac.createGain();this.mg.gain.value=1;this.mg.connect(this.out);
      const n=this.ac.sampleRate*.5,b=this.ac.createBuffer(1,n,this.ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nbuf=b}catch(e){}}
    if(this.ac&&this.ac.state==='suspended')this.ac.resume().catch(()=>{});
    if(this.ac&&this.want&&!this.cur)this.mus(this.want);
  },
  toggle(){this.on=!this.on;if(this.mg)this.mg.gain.value=this.on?(this.ducked?.4:1):0;if(this.on)this.unlock();Screens.music()},
  tone(f,d,type,v,sl,delay){
    if(!this.on||!this.ac)return;
    const t=this.ac.currentTime+(delay||0),o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+sl),t+d);
    g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.out||this.ac.destination);o.start(t);o.stop(t+d+.03);
  },
  /* ---- música: trilhas em chiptune geradas por código (sem arquivos) ---- */
  TRACKS:{
    menu:{bpm:100,root:110,wave:'square',scale:0,
      lead:'0 . 3 . 7 . 12 . 10 . 7 . 5 . 3 . 0 . 3 . 7 . 10 . 12 . 15 . 12 . 10 . 7 .',
      bass:'0 . 0 . 7 . 0 . 0 . 0 . 5 . 3 .'},
    forest:{bpm:90,root:98,wave:'triangle',scale:0,
      lead:'7 . . 3 . . 5 . 7 . . 10 . . 7 . 5 . . 3 . . 0 . 3 . . 5 . . 3 .',
      bass:'0 . . . 0 . . . 5 . . . 3 . . .'},
    training:{bpm:126,root:130.8,wave:'square',scale:0,
      lead:'0 4 7 4 12 7 4 7 0 4 7 4 9 7 4 2 5 9 12 9 17 12 9 12 7 11 14 11 12 7 4 7',
      bass:'0 . 0 7 0 . 0 7 5 . 5 12 7 . 7 5'},
    industrial:{bpm:112,root:82.4,wave:'sawtooth',scale:0,
      lead:'0 . 0 . 3 . 0 . 5 . 0 . 3 . 7 . 0 . 0 . 3 . 0 . 6 . 5 . 3 . 0 .',
      bass:'0 0 . 0 0 . 0 . 0 0 . 0 3 . 5 .'},
    control:{bpm:132,root:110,wave:'square',scale:0,
      lead:'0 3 7 10 12 10 7 3 0 3 7 10 12 10 7 3 -2 3 5 10 12 10 5 3 -4 0 3 7 12 7 3 0',
      bass:'0 . 0 . 0 . 0 . -2 . -2 . -4 . -4 .'}
  },
  cur:null,want:null,step:0,nextT:0,timer:0,ducked:false,
  mus(name){
    this.want=name;
    if(!this.ac)return;
    if(this.cur===name)return;
    clearInterval(this.timer);this.cur=name;this.step=0;
    if(!name||!this.TRACKS[name])return;
    this.pat={};const T=this.TRACKS[name];this.pat.lead=T.lead.split(/\s+/);this.pat.bass=T.bass.split(/\s+/);
    this.nextT=this.ac.currentTime+.08;
    this.timer=setInterval(()=>this.sched(),40);
  },
  duck(v){this.ducked=v;if(this.mg&&this.on)this.mg.gain.setTargetAtTime(v?.4:1,this.ac.currentTime,.05)},
  note(f,t,d,type,v,out){
    const o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.mg);o.start(t);o.stop(t+d+.03);
  },
  noise(t,d,v,hp){
    if(!this.nbuf)return;const s=this.ac.createBufferSource(),g=this.ac.createGain(),fl=this.ac.createBiquadFilter();
    s.buffer=this.nbuf;fl.type='highpass';fl.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(this.mg);s.start(t);s.stop(t+d+.02);
  },
  sched(){
    if(!this.ac||!this.cur)return;const T=this.TRACKS[this.cur];if(!T)return;
    const sd=60/T.bpm/4;
    while(this.nextT<this.ac.currentTime+.18){
      const t=this.nextT,i=this.step,fr=x=>T.root*Math.pow(2,x/12);
      if(this.on){
        const l=this.pat.lead[i%this.pat.lead.length];if(l!=='.')this.note(fr(+l+12),t,sd*1.8,T.wave,T.wave==='sawtooth'?.018:.026);
        const b=this.pat.bass[i%this.pat.bass.length];if(b!=='.')this.note(fr(+b)/2,t,sd*1.9,'triangle',.07);
        if(i%2===0)this.noise(t,.03,.03,7000);
        if(i%8===4)this.noise(t,.09,.05,1800);
        if(i%16===0||i%16===10)this.note(70,t,.1,'sine',.12);
      }
      this.nextT+=sd;this.step++;
    }
  },
  jump(){this.tone(280,.16,'square',.04,300)},
  coin(){this.tone(880,.06,'square',.035);this.tone(1320,.1,'square',.035,0,.06)},
  chip(){[660,880,1100,1320].forEach((f,i)=>this.tone(f,.1,'triangle',.07,0,i*.07))},
  hurt(){this.tone(220,.35,'sawtooth',.06,-160)},
  ok(){this.tone(660,.05,'square',.035)},
  tick(){this.tone(440,.03,'square',.025)},
  lever(){this.tone(120,.12,'square',.06);this.tone(90,.2,'square',.06,0,.12)},
  cp(){[520,660,780].forEach((f,i)=>this.tone(f,.12,'triangle',.06,0,i*.08))},
  rescue(){[523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.14,'triangle',.07,0,i*.09))},
  win(){[523,523,523,659,784,659,784,1047].forEach((f,i)=>this.tone(f,.2,'square',.045,0,i*.14))},
  no(){this.tone(160,.15,'square',.05)}
};

/* ---------------- Entrada unificada (teclado + touch + gamepad) ---------------- */
const ACTS=['left','right','up','down','jump','run','interact','pause','confirm','back'];
const KEYMAP={
  left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],up:['ArrowUp','KeyW'],down:['ArrowDown','KeyS'],
  jump:['Space','KeyK'],run:['ShiftLeft','ShiftRight'],interact:['KeyE','KeyJ'],
  pause:['Escape','KeyP'],confirm:['Enter','Space','KeyE'],back:['Escape','Backspace']
};
const Input={
  keys:new Set(),touch:{},pulses:{},prev:{},held:{},pressed:{},tapQ:null,tapNow:null,lastDev:'kb',padName:'',padSeen:false,
  keyAct(a){return KEYMAP[a].some(k=>this.keys.has(k))},
  pulse(a){this.pulses[a]=true},
  padState(){
    const out={};let gp=null;
    try{const l=navigator.getGamepads?navigator.getGamepads():[];for(const g of l){if(g&&g.connected){gp=g;break}}}catch(e){}
    if(!gp){this.padName='';return out}
    this.padName=gp.id;
    const ax=gp.axes[0]||0,ay=gp.axes[1]||0,b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    out.left=ax<-.45||b(14);out.right=ax>.45||b(15);out.up=ay<-.5||b(12);out.down=ay>.5||b(13);
    out.jump=b(0);out.confirm=b(0);out.run=b(1)||b(5)||b(7);out.back=b(1)||b(8);
    out.interact=b(2)||b(3);out.pause=b(9);
    if(Object.values(out).some(Boolean))this.lastDev='pad';
    return out;
  },
  poll(){
    const pad=this.padState(),cur={};
    for(const a of ACTS)cur[a]=!!(this.keyAct(a)||this.touch[a]>0||pad[a]);
    for(const a of ACTS){this.pressed[a]=(cur[a]&&!this.prev[a])||!!this.pulses[a];this.held[a]=cur[a]||!!this.pulses[a]}
    this.prev=cur;this.pulses={};this.tapNow=this.tapQ;this.tapQ=null;
  },
  hint(){return this.lastDev==='pad'?'X':this.lastDev==='touch'?'AÇÃO':'E'}
};
addEventListener('keydown',e=>{
  let used=false;
  for(const a of ACTS)if(KEYMAP[a].includes(e.code)){used=true;if(!e.repeat)Input.pulse(a)}
  if(used||e.code==='KeyF'||e.code==='KeyM'){e.preventDefault()}
  Input.keys.add(e.code);Input.lastDev='kb';Snd.unlock();
  if(!e.repeat&&e.code==='KeyF')Scale.fullscreen();
  if(!e.repeat&&e.code==='KeyM'){Snd.toggle()}
});

/* botões virtuais: um único tratador por grupo, permite deslizar o dedo entre botões */
function bindPad(pad){
  const map=new Map();
  const paint=()=>pad.querySelectorAll('[data-act]').forEach(b=>b.classList.toggle('on',Input.touch[b.dataset.act]>0));
  const setP=(id,act)=>{
    const old=map.get(id);if(old===act)return;
    if(old)Input.touch[old]=Math.max(0,(Input.touch[old]||0)-1);
    if(act){Input.touch[act]=(Input.touch[act]||0)+1;map.set(id,act);Input.pulse(act)}else map.delete(id);
    paint();
  };
  const actAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);const b=el&&el.closest&&el.closest('[data-act]');return b&&pad.contains(b)?b.dataset.act:null};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();Snd.unlock();Input.lastDev='touch';try{pad.setPointerCapture(e.pointerId)}catch(_){}setP(e.pointerId,actAt(e))});
  pad.addEventListener('pointermove',e=>{if(map.has(e.pointerId))setP(e.pointerId,actAt(e))});
  const end=e=>setP(e.pointerId,null);
  pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',end);
}

const Scale={
  fit(){
    const st=document.getElementById('stage'),aw=st.clientWidth,ah=st.clientHeight;
    /* tela larga (PC/TV): amplia o campo de visão horizontal em vez de deixar tarjas pretas, sem distorcer os pixels */
    const nw=Math.max(WMIN,Math.min(WMAX,Math.round(H*aw/Math.max(1,ah))));
    if(nw!==W){W=nw;cv.width=W;ctx.imageSmoothingEnabled=false;if(typeof BG!=='undefined'&&BG.init){const n=BG.name||'forest';BG.themes={};BG.init();BG.use(n)}}
    const s=Math.min(aw/W,ah/H);
    cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(H*s)+'px';
  },
  fullscreen(){
    try{
      if(document.fullscreenElement){document.exitFullscreen()}
      else{const r=document.documentElement.requestFullscreen;if(r)document.documentElement.requestFullscreen().catch(()=>{})}
    }catch(e){}
  }
};
addEventListener('resize',()=>Scale.fit());document.addEventListener('fullscreenchange',()=>setTimeout(()=>Scale.fit(),50));addEventListener('orientationchange',()=>setTimeout(()=>Scale.fit(),150));

function randomMate(exceptId){const o=[0,1,2].filter(i=>i!==exceptId);return{id:o[Math.floor(Math.random()*o.length)]}}
/* anim: idle | walk | run | jump | fall | crouch | cheer
   A arte é de frente: a direção é mostrada com inclinação do corpo e passos alternados. */
function drawChar(g,c,x,y,dir,anim,t,alpha){
  const im=SIMG[c.id],m=SPR.meta[c.id];if(!imgOk(im))return;
  const w=m.w,h=m.h,ax=m.ax,cy=m.cy,OV=3;
  const moving=anim==='walk'||anim==='run',air=anim==='jump'||anim==='fall';
  const ph=Math.floor(t/(anim==='run'?5:8))%4,run=anim==='run';
  let lL=0,lR=0,oL=0,oR=0,bob=0,lean=dir,hop=0;
  if(anim==='idle')bob=(Math.floor(t/26)%2);
  if(moving){
    lean=dir*(run?3:2);bob=ph%2;const k=run?5:3;
    if(ph===1)lL=k;if(ph===3)lR=k;
    oL=run?-1:0;oR=run?1:0;
  }
  if(anim==='jump'){lL=6;lR=3;oL=-1;oR=1;bob=-1;lean=dir*2}
  if(anim==='fall'){oL=-2;oR=2;bob=1;lean=dir*1}
  if(anim==='cheer'){hop=((t>>3)&1)*3;if((t>>3)&1)lL=3;else lR=3;lean=0}
  const dx=Math.round(x)-ax,dy=Math.round(y)-h-hop;
  g.save();if(alpha!=null)g.globalAlpha=alpha;
  if(!air){g.fillStyle='rgba(0,0,0,.3)';g.fillRect(Math.round(x)-8,Math.round(y)-1,16,3)}
  g.imageSmoothingEnabled=false;
  if(anim==='crouch'){
    /* agachar de verdade: pernas dobradas e abertas, tronco encurtado e cabeça à frente */
    const Y=Math.round(y),hh=15,lh=h-cy,legH=Math.round(lh*.5),legTop=Y-legH;
    const trH=Math.round((cy+OV-hh)*.58),trTop=legTop-trH+1,hdTop=trTop-hh+1;
    g.drawImage(im,0,cy,ax,lh,dx-2,legTop,ax,legH);
    g.drawImage(im,ax,cy,w-ax,lh,dx+ax+2,legTop,w-ax,legH);
    g.drawImage(im,0,hh,w,cy+OV-hh,dx+dir,trTop,w,trH);
    g.drawImage(im,0,0,w,hh,dx+dir*2,hdTop,w,hh);
  }else{
    /* pernas (atrás), depois tronco por cima com pequena sobreposição */
    g.drawImage(im,0,cy,ax,h-cy,dx+oL,dy+cy-lL,ax,h-cy);
    g.drawImage(im,ax,cy,w-ax,h-cy,dx+ax+oR,dy+cy-lR,w-ax,h-cy);
    g.drawImage(im,0,0,w,cy+OV,dx+lean,dy+bob,w,cy+OV);
  }
  g.restore();
}

}

/* construtor de fases: helpers para montar o mapa por colunas (16 px) e linhas */
function LB(n,theme,LW){
  const LH=17,g=[];for(let y=0;y<LH;y++)g.push(new Array(LW).fill(0));
  const L={n,name:LEVEL_NAMES[n-1],theme,W:LW,H:LH,g,spawn:{x:2*T+8,y:13*T},coins:[],chips:[],cps:[],levers:[],gates:[],cages:[],logs:[],movers:[],
    lasers:[],vents:[],belts:[],signs:[],lamps:[],crates:[],goal:null,chipTotal:0,rescueTotal:0,brief:''};
  L.tile=(tx,ty)=>{if(tx<0||tx>=LW)return 1;if(ty<0||ty>=LH)return 0;return g[ty][tx]};
  const set=(x,y,t)=>{if(x>=0&&x<LW&&y>=0&&y<LH)g[y][x]=t};
  const fill=(a,b,y1,y2,t)=>{for(let x=a;x<=b;x++)for(let y=y1;y<=y2;y++)set(x,y,t)};
  const b={L,set,fill,
    ground:(a,c,top)=>fill(a,c,top==null?13:top,LH-1,1),
    plank:(a,c,row)=>fill(a,c,row,row,3),
    spikes:(a,c,row)=>fill(a,c,row==null?12:row,row==null?12:row,5),
    tunnel:(a,c)=>{fill(a,c,0,9,2);fill(a,c,10,10,7)},
    belt:(a,c,dir)=>{fill(a,c,13,13,dir>0?8:9);L.belts.push({x1:a*T,x2:(c+1)*T,y:13*T,dir})},
    gate:(col,r1,r2)=>{r1=r1==null?8:r1;r2=r2==null?12:r2;fill(col,col,0,r1-1,6);fill(col,col,r1,r2,4);L.gates.push({col,r1,r2,open:false});return L.gates.length-1},
    lever:(col,gi,top)=>L.levers.push({x:col*T+8,y:(top==null?13:top)*T,on:false,gate:gi}),
    cage:(col,top)=>L.cages.push({x:col*T+8,y:(top==null?13:top)*T,open:false,mate:null}),
    cp:(col,top)=>L.cps.push({x:col*T+8,y:(top==null?13:top)*T,on:false}),
    coin:(c,r)=>L.coins.push({x:c*T+8,y:r*T+8,got:false}),
    row:(a,c,r)=>{for(let i=a;i<=c;i++)L.coins.push({x:i*T+8,y:r*T+8,got:false})},

const SOLIDS=id=>!!SOLID[id];
function tilesIn(L,l,t,r,b,fn){
  const x0=Math.floor(l/T),x1=Math.floor((r-.001)/T),y0=Math.floor(t/T),y1=Math.floor((b-.001)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)fn(L.tile(tx,ty),tx,ty);
}
function solidRects(L,l,t,r,b){
  const out=[];
  tilesIn(L,l,t,r,b,(id,tx,ty)=>{
    if(!SOLIDS(id))return;
    const rc=[tx*T,ty*T,T,id===7?12:T];
    if(l<rc[0]+rc[2]&&r>rc[0]&&t<rc[1]+rc[3]&&b>rc[1])out.push(rc);
  });
  return out;
}
const Game={
  toasts:[],parts:[],shake:0,frame:0,totalTime:0,
  toast(s){this.toasts.push({s,life:150})},
  start(ci,lv){
    this.ci=ci;this.cfg=CHARS[ci];this.lives=3;this.score=0;this.totalTime=0;this.begin(lv||0);
  },
  begin(lv){
    this.lv=lv;this.L=LEVELS[lv]();this.tiles=renderTiles(this.L);BG.use(this.L.theme);
    this.chips=0;this.rescued=0;this.mates=[];this.won=false;this.winT=0;this.time=0;this.cpIdx=-1;
    this.cam={x:0};this.parts=[];this.toasts=[];this.hist=[];this.msgT=200;this.near=null;
    this.L.cages.forEach(c=>{c.mate=randomMate(this.ci)});
    this.lives=Math.max(this.lives,3);
    const sp=this.L.spawn;
    this.p={x:sp.x,y:sp.y,vx:0,vy:0,w:12,h:HS,dir:1,onGround:false,crouch:false,coyote:0,buf:0,inv:0,anim:'idle',t:0,jumping:false,plat:null};
  },
  respawn(){
    const p=this.p,c=this.cpIdx>=0?this.L.cps[this.cpIdx]:this.L.spawn;
    p.x=c.x;p.y=c.y;p.vx=p.vy=0;p.inv=120;p.crouch=false;p.h=HS;p.onGround=false;p.plat=null;
    this.hist=[];for(let i=0;i<200;i++)this.hist.push({x:p.x,y:p.y,dir:p.dir,anim:'idle',t:0});
    this.cam.x=clamp(p.x-W/2,0,this.L.W*T-W);
  },
  hurt(){
    const p=this.p;if(p.inv>0||this.won)return;
    this.lives--;Snd.hurt();this.shake=12;
    if(this.lives<=0){Screens.set('gameover');return}
    this.respawn();this.toast('VOCÊ VOLTOU AO CHECKPOINT');
  },
  burst(x,y,col,n){for(let i=0;i<n;i++)this.parts.push({x,y,vx:(Math.random()-.5)*2.4,vy:-Math.random()*2.4,life:25+Math.random()*15,col})},
  add(n){this.score+=n},
  finish(){
    const m=Save.mem;m.unlocked=Math.max(m.unlocked||1,Math.min(4,this.lv+2));
    const b=m.best;this.newRec=!b[this.L.n]||this.score>b[this.L.n];if(this.newRec)b[this.L.n]=this.score;Save.write();
    this.totalTime+=this.time;
  },
  update(){
    const L=this.L,p=this.p,I=Input,cfg=this.cfg;
    this.frame++;
    if(I.pressed.pause){Screens.set('pause');return}
    if(!this.won)this.time+=1/60;
    if(this.msgT>0)this.msgT--;
    /* plataformas móveis, lasers e vapor (ciclos baseados no relógio da fase) */
    for(const m of L.movers){
      const ox=m.x,oy=m.y;
      if(m.wait>0){m.wait--}
      else if(m.ax==='x'){m.x+=m.dir*m.sp;if(m.x>=m.max){m.x=m.max;m.dir=-1;m.wait=45}if(m.x<=m.min){m.x=m.min;m.dir=1;m.wait=45}}
      else{m.y+=m.dir*m.sp;if(m.y>=m.max){m.y=m.max;m.dir=-1;m.wait=45}if(m.y<=m.min){m.y=m.min;m.dir=1;m.wait=45}}
      m.dx=m.x-ox;m.dy=m.y-oy;
    }
    for(const z of L.lasers){const ph=(this.frame+z.phase)%z.period;z.on=ph<z.onLen;z.warn=!z.on&&ph>=z.period-24}
    for(const v of L.vents){const ph=(this.frame+v.phase)%v.period;v.on=ph<v.burst;v.warn=!v.on&&ph>=v.period-36}
    /* controles */
    const can=!this.won;
    const dirIn=can?((I.held.right?1:0)-(I.held.left?1:0)):0;
    if(dirIn)p.dir=dirIn;
    /* agachar */
    const wantCrouch=can&&I.held.down&&p.onGround;
    if(wantCrouch&&!p.crouch){p.crouch=true;p.h=HC}
    else if(!wantCrouch&&p.crouch){
      if(solidRects(L,p.x-HW,p.y-HS,p.x+HW,p.y).length===0){p.crouch=false;p.h=HS}
    }
    const run=I.held.run&&!p.crouch;
    const target=dirIn*(p.crouch?.8:(run?cfg.run:cfg.walk));
    const acc=p.onGround?.28:.14;
    p.vx+=(target-p.vx)*acc;if(Math.abs(p.vx)<.02&&!dirIn)p.vx=0;
    /* pulo com coyote time, buffer e altura variável */
    if(can&&I.pressed.jump)p.buf=7;else if(p.buf>0)p.buf--;
    if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
    if(p.buf>0&&p.coyote>0&&!p.crouch){p.vy=-cfg.jump;p.buf=0;p.coyote=0;p.jumping=true;p.plat=null;Snd.jump();this.burst(p.x,p.y,'#c8d0b0',4)}
    if(p.jumping&&!I.held.jump&&p.vy<-3)p.vy=-3;
    if(p.vy>=0)p.jumping=false;
    p.vy=Math.min(p.vy+.42,9);
    /* carona na plataforma e empurrão da esteira */
    let push=0;
    if(p.plat){p.x+=p.plat.dx;p.y+=p.plat.dy}
    else if(p.onGround){const id=L.tile(Math.floor(p.x/T),Math.floor((p.y+2)/T));push=id===8?.8:id===9?-.8:0}
    p.plat=null;
    /* movimento + colisões por eixo */
    const mvx=p.vx+push;p.x+=mvx;
    for(const rc of solidRects(L,p.x-HW,p.y-p.h,p.x+HW,p.y)){
      if(mvx>0)p.x=Math.min(p.x,rc[0]-HW);else if(mvx<0)p.x=Math.max(p.x,rc[0]+rc[2]+HW);
      p.vx=0;
    }
    const prevY=p.y;p.y+=p.vy;const wasGround=p.onGround;p.onGround=false;
    for(const rc of solidRects(L,p.x-HW,p.y-p.h,p.x+HW,p.y)){
      if(p.vy>0){p.y=Math.min(p.y,rc[1]);p.vy=0;p.onGround=true}
      else if(p.vy<0){p.y=Math.max(p.y,rc[1]+rc[3]+p.h);p.vy=0;p.jumping=false}
    }
    if(p.vy>=0){
      tilesIn(L,p.x-HW,p.y-1,p.x+HW,p.y+1,(id,tx,ty)=>{
        if(id===3){const top=ty*T;if(prevY<=top+.01&&p.y>=top&&p.vy>=0){p.y=top;p.vy=0;p.onGround=true}}
      });
      for(const m of L.movers){

function Menu(items,y,gap,size){
  return{i:0,items,y,gap:gap||20,size:size||10,
    lab(it){return typeof it.label==='function'?it.label():it.label},
    update(){
      const I=Input,n=this.items.length;
      if(I.pressed.up){this.i=(this.i+n-1)%n;Snd.tick()}
      if(I.pressed.down){this.i=(this.i+1)%n;Snd.tick()}
      if(I.pressed.confirm){Snd.ok();this.items[this.i].go();return}
      const tp=I.tapNow;
      if(tp)for(let k=0;k<n;k++){
        if(Math.abs(tp.x-W/2)<130&&tp.y>=this.y+k*this.gap-6&&tp.y<this.y+k*this.gap+this.gap-6){this.i=k;Snd.ok();this.items[k].go();return}
      }
    },
    draw(){
      this.items.forEach((it,k)=>{
        const y=this.y+k*this.gap,sel=k===this.i;
        if(sel){ctx.fillStyle='rgba(240,138,28,.18)';ctx.fillRect(W/2-120,y-5,240,this.gap-2);ctx.fillStyle='#f08a1c';ctx.fillRect(W/2-120,y-5,3,this.gap-2);
          if((Game.frame>>4)&1||true)txt('▶',W/2-112,y,this.size,'#f08a1c')}
        txt(this.lab(it),W/2,y,this.size,sel?'#fff3d6':'#9aa3c0','center');
      });
    }
  };
}

/* ---------------- Laço principal (passo fixo de 60 Hz) ---------------- */
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;
  let steps=0;
  while(acc>=1000/60&&steps<5){Input.poll();Screens.cur.update();acc-=1000/60;steps++}
  if(steps===5)acc=0;
  Screens.cur.draw();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&Screens.name==='play')Screens.set('pause')});

requestAnimationFrame(t=>{last=t;frame(t)});
